spring.application.name=nutribubble
server.port=8086

# Vistas JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Recursos estáticos
spring.web.resources.static-locations=classpath:/webapp/

# Scripts SQL que se ejecutan al iniciar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2: http://localhost:8086/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sin JPA/Hibernate: usamos JdbcTemplate
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
